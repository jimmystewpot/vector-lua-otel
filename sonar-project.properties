sonar.projectKey=jimmystewpot_vector-lua-otel
sonar.organization=jimmystewpot
sonar.projectName=vector-lua-otel

# Encoding of source code
sonar.sourceEncoding=UTF-8

# Source and test directories
sonar.sources=include, src
sonar.tests=tests

# Exclusions for build artifacts and external metadata
sonar.exclusions=build/**, cmake/**, .github/**, **/*.rockspec, third_party/**

# C/C++ compilation database and coverage reports
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.coverageReportPaths=build/coverage.xml

# Multi-criteria issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# S134: Control flow nesting in high-performance OTLP JSON extractors
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.e1.resourceKey=src/extractors/**

# S3776: Cognitive complexity in OTLP extractors
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=src/extractors/**

# S134/S3776 in extractor headers if triggered
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.e3.resourceKey=include/vector_otel/extractors/**

# S3656: GoogleTest protected member access in fixtures
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**

# S1186: Empty functions/methods in test fixtures or mock helpers
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.e5.resourceKey=tests/**

# S3577: Test class naming conventions
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S3577
sonar.issue.ignore.multicriteria.e6.resourceKey=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**, bench/**, cmake/**, third_party/**

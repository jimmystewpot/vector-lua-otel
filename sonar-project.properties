sonar.projectKey=jimmystewpot_vector-lua-otel
sonar.organization=jimmystewpot
sonar.projectName=vector-lua-otel

# Encoding of source code
sonar.sourceEncoding=UTF-8

# Source and test directories
sonar.sources=include, src
sonar.tests=tests

# Exclusions for build artifacts and external metadata
sonar.exclusions=build/**, cmake/**, .github/**, **/*.rockspec

# C/C++ compilation database and coverage reports
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.coverageReportPaths=build/coverage.xml

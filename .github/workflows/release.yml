name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify Lineage, Package & Test Tarball
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      full_version: ${{ steps.package.outputs.full_version }}
      rockspec_version: ${{ steps.package.outputs.rockspec_version }}
      is_prerelease: ${{ steps.package.outputs.is_prerelease }}
      tarball_name: ${{ steps.package.outputs.tarball_name }}
      rockspec_name: ${{ steps.package.outputs.rockspec_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify tagged commit is on main
        env:
          TARGET_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit $TARGET_SHA ($TAG_NAME) is not an ancestor of origin/main."
            exit 1
          fi

      - name: Install build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            luarocks \
            cmake \
            ninja-build \
            gcc \
            g++

      - name: Package deterministic release archive and rockspec
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/package_release.sh "$TAG_NAME" dist
          # Export metadata to GITHUB_OUTPUT
          while IFS='=' read -r key val; do
            case "$key" in
              TAG) echo "tag=$val" >> "$GITHUB_OUTPUT" ;;
              FULL_VERSION) echo "full_version=$val" >> "$GITHUB_OUTPUT" ;;
              ROCKSPEC_VERSION) echo "rockspec_version=$val" >> "$GITHUB_OUTPUT" ;;
              IS_PRERELEASE) echo "is_prerelease=$val" >> "$GITHUB_OUTPUT" ;;
              TARBALL_NAME) echo "tarball_name=$val" >> "$GITHUB_OUTPUT" ;;
              ROCKSPEC_NAME) echo "rockspec_name=$val" >> "$GITHUB_OUTPUT" ;;
            esac
          done < dist/release-metadata.env

      - name: Smoke-test unpacked release tarball in isolated directory
        env:
          FULL_VERSION: ${{ steps.package.outputs.full_version }}
          TARBALL_NAME: ${{ steps.package.outputs.tarball_name }}
        run: |
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          tar -xzf "dist/$TARBALL_NAME" -C "$SMOKE_DIR"
          SRC_DIR="$SMOKE_DIR/vector-lua-otel-$FULL_VERSION"
          cmake -S "$SRC_DIR" -B "$SRC_DIR/build" -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_QUIET=OFF -GNinja
          cmake --build "$SRC_DIR/build"
          ctest --test-dir "$SRC_DIR/build" --output-on-failure
          (cd "$SRC_DIR" && bash tests/lua/run_tests.sh)
          if readelf -d "$SRC_DIR/build/vector_otel.so" | grep -q liblua; then
            echo "::error::vector_otel.so incorrectly links liblua"
            exit 1
          fi

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/${{ steps.package.outputs.tarball_name }}
            dist/${{ steps.package.outputs.rockspec_name }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: Sign & Publish GitHub Release
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Verify SHA256SUMS integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release archive and checksums with Keyless OIDC Cosign
        env:
          TAG_NAME: ${{ needs.verify-and-package.outputs.tag }}
          TARBALL_NAME: ${{ needs.verify-and-package.outputs.tarball_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          cd dist
          cosign sign-blob --yes --bundle "${TARBALL_NAME}.sigstore.json" "${TARBALL_NAME}"
          cosign sign-blob --yes --bundle "SHA256SUMS.sigstore.json" "SHA256SUMS"

          EXPECTED_IDENTITY="https://github.com/${REPO_SLUG}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          cosign verify-blob \
            --bundle "${TARBALL_NAME}.sigstore.json" \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${TARBALL_NAME}"

          cosign verify-blob \
            --bundle "SHA256SUMS.sigstore.json" \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "SHA256SUMS"

      - name: Generate GitHub SLSA Build Provenance Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ needs.verify-and-package.outputs.tarball_name }}
            dist/${{ needs.verify-and-package.outputs.rockspec_name }}
            dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify-and-package.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify-and-package.outputs.is_prerelease }}
          TARBALL_NAME: ${{ needs.verify-and-package.outputs.tarball_name }}
          ROCKSPEC_NAME: ${{ needs.verify-and-package.outputs.rockspec_name }}
        run: |
          RELEASE_FLAGS=(--verify-tag --title "vector-lua-otel ${TAG_NAME}" --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            RELEASE_FLAGS+=(--latest)
          fi

          gh release create "$TAG_NAME" \
            "${RELEASE_FLAGS[@]}" \
            "dist/${TARBALL_NAME}" \
            "dist/${TARBALL_NAME}.sigstore.json" \
            "dist/${ROCKSPEC_NAME}" \
            "dist/SHA256SUMS" \
            "dist/SHA256SUMS.sigstore.json"

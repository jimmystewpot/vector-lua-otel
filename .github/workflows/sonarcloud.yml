name: SonarCloud project analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "1 1 2 * *"

permissions:
  contents: read
  pull-requests: read # Allows SonarCloud to decorate PRs with analysis results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    name: "Analyse with SonarCloud"
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones disabled for accurate blame and change analysis
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++ \
            gcovr

      - name: Configure CMake with coverage and compilation database
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -GNinja

      - name: Build project
        run: |
          cmake --build build

      - name: Run C++ test suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Lua integration test suite
        run: |
          bash tests/lua/run_tests.sh

      - name: Generate code coverage report
        run: |
          gcovr --sonarqube build/coverage.xml -r . \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --exclude "tests/.*" \
            --exclude "build/.*" \
            --exclude "cmake/.*" \
            --exclude "third_party/.*"

      - name: Analyze project with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip SonarCloud upload if SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN secret is not configured; skipping upload step."

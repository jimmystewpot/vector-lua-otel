name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            luarocks \
            cmake \
            ninja-build \
            clang-format \
            clang \
            gcc \
            g++

      - name: Check formatting
        # Note: vendored code under third_party/ is deliberately not formatted
        run: find include src tests/cpp -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cpp" \) | xargs -r clang-format --dry-run --Werror

      - name: Configure and build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build

      - name: Run C++ test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Lua integration test suite
        run: bash tests/lua/run_tests.sh

      - name: Validate rockspec
        run: luarocks lint vector-otel-scm-1.rockspec

      - name: Validate release packaging script
        run: bash tests/scripts/test_package_release.sh --skip-tarball-build

  sanitizers:
    name: Sanitizers (ASAN/UBSAN)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            luarocks \
            cmake \
            ninja-build \
            clang-format \
            clang \
            gcc \
            g++

      - name: Configure and build with CMake (ASAN/UBSAN)
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -GNinja
          cmake --build build-asan

      - name: Run C++ test suite under ASAN/UBSAN
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-asan --output-on-failure

  batch-mode:
    name: Batch mode (VECTOR_OTEL_EMIT_BATCH_SIZE=3)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++

      - name: Configure and build with a compile-time batch size of 3
        run: |
          cmake -B build-batch -DCMAKE_BUILD_TYPE=Debug -DVECTOR_OTEL_EMIT_BATCH_SIZE=3 -GNinja
          cmake --build build-batch

      - name: Run batch-mode tests
        run: ./build-batch/vector_otel_tests --gtest_filter='*BatchMode*'

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++ \
            gcovr

      - name: Configure and build with CMake (Coverage)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -GNinja
          cmake --build build

      - name: Run C++ test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Lua integration test suite
        run: bash tests/lua/run_tests.sh

      - name: Generate Cobertura coverage report
        run: |
          gcovr --xml-pretty -o build/cobertura.xml -r . \
            --exclude "tests/.*" \
            --exclude "build/.*" \
            --exclude "cmake/.*" \
            --exclude "third_party/.*"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jimmystewpot/vector-lua-otel
          files: build/cobertura.xml

  offline-build:
    name: Offline Build (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify offline build
        run: bash scripts/verify_offline_build.sh

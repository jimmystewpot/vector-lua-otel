name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            luarocks \
            cmake \
            ninja-build \
            clang-format \
            clang \
            gcc \
            g++

      - name: Check formatting
        # Note: vendored code under third_party/ is deliberately not formatted
        run: find include src tests/cpp -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cpp" \) | xargs -r clang-format --dry-run --Werror

      - name: Configure and build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build

      - name: Run C++ test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Lua integration test suite
        run: bash tests/lua/run_tests.sh

      - name: Verify the shared modules do not link liblua
        # Lua symbols must resolve from the host (Vector) executable at runtime.
        run: |
          for module in build/vector_otel.so build/vector_native.so; do
            if readelf -d "$module" | grep -Ei 'NEEDED.*lua'; then
              echo "::error::$module links liblua"
              exit 1
            fi
          done

      - name: Validate rockspec
        run: luarocks lint vector-otel-scm-1.rockspec

      - name: Validate release packaging script
        run: bash tests/scripts/test_package_release.sh --skip-tarball-build

  sanitizers:
    name: Sanitizers (ASAN/UBSAN)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            luarocks \
            cmake \
            ninja-build \
            clang-format \
            clang \
            gcc \
            g++

      - name: Configure and build with CMake (ASAN/UBSAN)
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -GNinja
          cmake --build build-asan

      - name: Run C++ test suites under ASAN/UBSAN
        # vector_otel_fault_tests (global operator new replacement) is not built when sanitizers
        # are enabled; vector_otel_worker_tests is.
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-asan --output-on-failure

  tsan:
    name: ThreadSanitizer (worker isolation)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++

      - name: Configure and build the worker tests with TSAN
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -GNinja
          cmake --build build-tsan --target vector_otel_worker_tests

      - name: Run worker-isolation tests under TSAN
        run: TSAN_OPTIONS=halt_on_error=1 ./build-tsan/vector_otel_worker_tests

  limit-matrix:
    name: Payload limit matrix (default / 8 MiB / 32 MiB)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++

      - name: Run the limit build matrix
        # Offline: builds default, 8 MiB and 32 MiB and runs the focused tests against both real
        # modules; 1 byte and 512 MiB are configure-only; invalid values must be rejected.
        run: JOBS=4 bash scripts/test_limit_builds.sh

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblua5.4-dev \
            lua5.4 \
            cmake \
            ninja-build \
            gcc \
            g++ \
            gcovr

      - name: Configure and build with CMake (Coverage)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -GNinja
          cmake --build build

      - name: Run C++ test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Lua integration test suite
        run: bash tests/lua/run_tests.sh

      - name: Generate Cobertura coverage report
        run: |
          gcovr --xml-pretty -o build/cobertura.xml -r . \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --exclude "tests/.*" \
            --exclude "build/.*" \
            --exclude "cmake/.*" \
            --exclude "third_party/.*"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jimmystewpot/vector-lua-otel
          files: build/cobertura.xml

  offline-build:
    name: Offline Build (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify offline build
        run: bash scripts/verify_offline_build.sh
